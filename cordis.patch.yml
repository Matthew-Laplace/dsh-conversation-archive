# dsh-conversation-archive — Codex CLI 面板
# 只注册一个插件：档案导出/刷新、面板 HTTP 接口、只读工具。
# 面板本身通过 Codex CLI（codex exec resume / codex queue）继续原线程，不经过 DSH 会话与模型。
- insert:
    - id: conversation-archive
      name: 'dsh-conversation-archive'
      config:
        root: ~/.dsh/conversation-archive
# Codex CLI 路径与超时（可选，默认自动探测 /Applications/ChatGPT.app 里的 CLI）：
#   codex:
#     cli: /Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex
#     resumeTimeoutMs: 900000
